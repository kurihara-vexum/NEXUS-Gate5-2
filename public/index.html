<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>端末貸出管理 | NEXUS</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="app-frame">
  <aside class="sidebar" aria-label="メインナビゲーション">
    <a class="brand" href="/" aria-label="NEXUS ホーム"><span class="brand-mark">N</span><span>NEXUS</span></a>
    <nav>
      <a class="nav-item active" href="/"><span class="nav-icon">▦</span>端末貸出</a>
      <span class="nav-item muted"><span class="nav-icon">⌁</span>利用履歴</span>
      <span class="nav-item muted"><span class="nav-icon">◇</span>端末マスター</span>
    </nav>
    <div class="sidebar-footer"><span class="avatar">管</span><div><strong>管理担当者</strong><small>IT Operations</small></div></div>
  </aside>
<main class="shell">
  <header><div><p class="eyebrow">DEVICE MANAGEMENT</p><h1>端末貸出</h1><p class="lead">社内端末の貸出状況と返却予定を管理します。</p></div><button id="reset" class="ghost" type="button"><span>↻</span> 初期状態に戻す</button></header>
  <div id="message" class="message" role="alert" aria-live="assertive" hidden></div>
  <section class="stats" aria-label="端末サマリー">
    <article><span class="stat-icon available-dot">●</span><div><small>貸出可能</small><strong id="available-count">—</strong></div></article>
    <article><span class="stat-icon loaned-dot">●</span><div><small>貸出中</small><strong id="loaned-count">—</strong></div></article>
    <article><span class="stat-icon maintenance-dot">●</span><div><small>整備中</small><strong id="maintenance-count">—</strong></div></article>
    <article><span class="stat-icon total-dot">●</span><div><small>登録端末</small><strong id="total-count">—</strong></div></article>
  </section>
  <section class="panel">
    <div class="section-title"><div class="title-icon">＋</div><div><h2>新しい貸出を登録</h2><p>端末・返却予定日・利用目的を入力してください。</p></div></div>
    <form id="loan-form" class="loan-form">
      <label><span>端末</span><select id="device" name="deviceId" required></select></label>
      <label><span>利用者</span><output id="current-user" class="read-only-field">—</output><small>ログイン情報から自動設定</small></label>
      <label><span>返却予定日</span><input id="due-date" name="dueDate" type="date" required><small>明日以降の日付を指定</small></label>
      <label><span>利用目的</span><input id="purpose" name="purpose" maxlength="100" required placeholder="例：社外打ち合わせ"><small>100文字以内</small></label>
      <button class="primary" type="submit">貸出を登録 <span>→</span></button>
    </form>
  </section>
  <section class="panel">
    <div class="section-title table-title"><div><h2>端末一覧</h2><p>登録されているすべての端末</p></div><span id="device-total" class="record-count">— 台</span></div>
    <div class="table-wrap"><table><thead><tr><th>管理番号</th><th>端末</th><th>状態</th><th>利用者</th><th>返却予定日</th><th></th></tr></thead><tbody id="device-list"></tbody></table></div>
  </section>
</main></div><script type="module" src="/app.js"></script></body>
</html>
