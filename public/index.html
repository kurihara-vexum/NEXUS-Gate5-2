<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>端末貸出管理 | NEXUS</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell">
  <header><div><p class="eyebrow">NEXUS / DEVICE CONTROL</p><h1>端末貸出管理</h1><p class="lead">貸出と返却を、矛盾のないひとつの記録として管理します。</p></div><button id="reset" class="ghost" type="button">確認データをリセット</button></header>
  <div id="message" class="message" role="alert" aria-live="assertive" hidden></div>
  <section class="panel">
    <div class="section-title"><span>01</span><div><h2>新しい貸出</h2><p>貸出中・整備中の端末も選択できますが、登録時に安全に拒否されます。</p></div></div>
    <form id="loan-form" class="loan-form">
      <label>端末<select id="device" name="deviceId" required></select></label>
      <label>利用者<select id="borrower" name="borrowerId" required></select></label>
      <label>返却予定日<input id="due-date" name="dueDate" type="date" required><small>今日以降を指定してください</small></label>
      <button class="primary" type="submit">貸出を登録</button>
    </form>
    <div class="demo-actions" aria-label="エラー状態確認"><span>撮影用:</span><button id="demo-loaned" type="button">貸出中端末のエラーを表示</button><button id="demo-past" type="button">過去日のエラーを表示</button></div>
  </section>
  <section class="panel">
    <div class="section-title"><span>02</span><div><h2>端末一覧</h2><p>現在の貸出状態と返却予定日</p></div></div>
    <div class="table-wrap"><table><thead><tr><th>管理番号</th><th>端末</th><th>状態</th><th>利用者</th><th>返却予定日</th><th></th></tr></thead><tbody id="device-list"></tbody></table></div>
  </section>
</main><script type="module" src="/app.js"></script></body>
</html>
